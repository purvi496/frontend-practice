<!DOCTYPE html>
<!--to tell the browser that its a html file.if we dont add this it will consider(quirks model which is old and as no structure)-->
<html lang="en">
<!--its useful for browser translators to translate the total code into some other language-->

<head>
    <!--it contains information about my web page.i can link css file in head part-->
    <meta charset="UTF-8">
    <!--to accept or allow emojis, symbols, any other language inside the web page-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--according to the viewport the total webpage will be adjusted to the content(responsive websites)-->
    <title>HTML</title>
    <!--for adding title of the web page-->
</head>

<body>
    <center>
        <h1>Basics of html</h1>
    </center>
    <p>today's topic starts with 
        <br><em>logical tags</em></p>
    <p>we aare discussing some tags in <abbr title="hyper text markup language ">HTML</abbr></p>
    <acronym title="css"><strong>cascading style sheets</strong></acronym>
    <p>we have &lt;address&gt; tag</p>
    <p>To print in java we use <code>System.out.println("Hola");</code></p>
    <p>the book is <cite>web technology</cite></p>
    <hr>
    <footer>
        <address>kolar, karnataka</address>
    </footer>
</body>

</html>
