<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            line-height:2;
            text-indent:50px;
        }
        h1{
            color:aquamarine;
            text-align:center;
            text-transform:uppercase;
            text-shadow: 2px 2px 5px black;
        }
        p{
            text-align:left;
            letter-spacing: 5px;
        }
        a{
            text-decoration:10px underline dotted red;
            word-spacing: 10px;
        }
        h3{
            text-shadow: 0px 0px 5px rgb(64, 172, 240);
        }
    </style>
</head>
<body>
    <h1>My Website</h1>
    <p>Welcome to my website! This is a simple HTML page with some basic styling.</p>
    <a href="#">Click here to learn more</a>
    <h3>Shadow</h3>
</body>
</html>
