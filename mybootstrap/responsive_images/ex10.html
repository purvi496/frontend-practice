<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Images</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Bootstrap Image Styles</h2>

    <div class="row text-center">

        <!-- Rounded Image -->
        <div class="col-md-4">
            <h4>Rounded Image</h4>
            <img src="https://picsum.photos/250/250?random=1"
                 class="rounded img-fluid"
                 alt="Rounded Image">
        </div>

        <!-- Circular Image -->
        <div class="col-md-4">
            <h4>Circular Image</h4>
            <img src="https://picsum.photos/250/250?random=2"
                 class="rounded-circle img-fluid"
                 alt="Circular Image">
        </div>

        <!-- Thumbnail Image -->
        <div class="col-md-4">
            <h4>Thumbnail Image</h4>
            <img src="https://picsum.photos/250/250?random=3"
                 class="img-thumbnail img-fluid"
                 alt="Thumbnail Image">
        </div>

    </div>
</div>

</body>
</html>
