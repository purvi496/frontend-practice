<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <!-- Header -->
    <div class="row">
        <div class="col-12 bg-danger text-white text-center p-3 rounded">
            <h3>Purvi's Webpage</h3>
            <small>Simple Bootstrap Layout</small>
        </div>
    </div>

    <!-- Middle Section -->
    <div class="row mt-3">

        <!-- Left Sidebar -->
        <div class="col-3">
            <div class="bg-warning text-dark text-center p-5 h-100 rounded">
                <h5>About</h5>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-6">
            <div class="bg-white border text-center p-5 h-100 rounded">
                <h4>Welcome</h4>
                <p>Learning Bootstrap Grid System</p>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="col-3">
            <div class="bg-success text-white text-center p-5 h-100 rounded">
                <h5>Projects</h5>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="row mt-3">
        <div class="col-12 bg-primary text-white text-center p-3 rounded">
            <strong>© 2026 Purvi | Thank You!</strong>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
