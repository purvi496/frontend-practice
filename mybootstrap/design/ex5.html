<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h2 class="text-center mt-3">Responsive Product Cards</h2>

<div class="container mt-4">
    <div class="row">

        <!-- Product 1 -->
        <div class="col-sm-12 col-md-6 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Iphone</h5>
                    <p class="card-text">Price: ₹100500</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-sm-12 col-md-6 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">headset</h5>
                    <p class="card-text">Price: ₹700</p>
                    <button class="btn btn-success">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-sm-12 col-md-6 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">watch</h5>
                    <p class="card-text">Price: ₹900</p>
                    <button class="btn btn-warning">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-sm-12 col-md-6 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Product 4</h5>
                    <p class="card-text">Price: ₹1200</p>
                    <button class="btn btn-danger">Buy Now</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
